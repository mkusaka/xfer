name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".pinact.yaml"
  push:
    paths:
      - ".github/workflows/**"
      - ".pinact.yaml"
  workflow_dispatch: {}

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Install actionlint
        id: get_actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: token $GITHUB_TOKEN" \
            --output /tmp/download-actionlint.bash \
            "https://raw.githubusercontent.com/rhysd/actionlint/$ACTIONLINT_VERSION/scripts/download-actionlint.bash"
          bash /tmp/download-actionlint.bash "${ACTIONLINT_VERSION:1}"
      - name: Check workflows
        env:
          ACTIONLINT_EXECUTABLE: ${{ steps.get_actionlint.outputs.executable }}
        run: '"$ACTIONLINT_EXECUTABLE" -color'

  pinact:
    name: pinact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinact
        env:
          PINACT_VERSION: v4.1.1
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="pinact_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --header "Authorization: token $GITHUB_TOKEN" \
            --output "/tmp/$archive" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/$PINACT_VERSION/$archive"
          curl --fail --silent --show-error --location \
            --header "Authorization: token $GITHUB_TOKEN" \
            --output /tmp/pinact_checksums.txt \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/$PINACT_VERSION/pinact_${PINACT_VERSION:1}_checksums.txt"
          (cd /tmp && grep "  $archive\$" pinact_checksums.txt | sha256sum --check -)
          tar -xzf "/tmp/$archive" -C /tmp
          sudo install -m 0755 /tmp/pinact /usr/local/bin/pinact
      - name: Check pinned action references
        run: pinact run --check
